# Rendimiento del sitio del congreso en nginx (se incluye dentro del bloque server de congresosaberes.net).
# Instalación en el VPS: ver LEEME.md, sección «Rendimiento del servidor».

# Compresión de textos (JS, CSS, SVG, JSON): reduce cerca de un 70 % lo que se descarga
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

# Archivos de Vite: llevan una huella en el nombre, así que el navegador los guarda un año sin preguntar
location ^~ /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# Imágenes, insignias, afiches y fuentes: un día en el navegador (los afiches se reemplazan con el mismo nombre)
location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
    expires 1d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
}
